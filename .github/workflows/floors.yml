name: floors

# Guards the version-floor pipeline: Dependabot bumps `floors/`, the canonical
# files must carry the same floors, and the floors must resolve together.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Canonical files must match floors/ — on drift, run `scripts/check_floors.py --write`.
      - run: uv run python scripts/check_floors.py
      # An unsatisfiable or stale lock means a floor change was not resolved.
      - run: uv lock --check --project floors/python

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: floors/typescript/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: floors/typescript
